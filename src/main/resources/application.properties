spring.application.name=Mayday
spring.config.import=optional:classpath:application-local.properties
spring.main.web-application-type=servlet
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mayday}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
openai.api.key=${OPENAI_API_KEY}
google.vision.api-key=${GOOGLE_VISION_API_KEY:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

demo.login.enabled=${DEMO_LOGIN_ENABLED:false}
demo.login.email=${DEMO_LOGIN_EMAIL:mayday@demo.local}
demo.login.password=${DEMO_LOGIN_PASSWORD:demo-password-change-me}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB